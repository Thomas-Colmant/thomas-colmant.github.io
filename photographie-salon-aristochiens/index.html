<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photographie Salon Aristochiens | Thomas Colmant</title>

    <!-- Modern typography: Poppins -->
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../style.css">

    <style>
        /* Photo grid masonry layout */
        .photo-grid {
            column-count: 3;
            column-gap: 1.2rem;
        }

        .photo-item {
            break-inside: avoid;
            margin-bottom: 1.2rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(10px);
            cursor: pointer;
        }

        .photo-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 60px rgba(174, 198, 255, 0.25);
            border-color: rgba(174, 198, 255, 0.3);
        }

        .photo-item img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.3s ease;
        }

        .photo-item:hover img {
            transform: scale(1.05);
        }

        @media (max-width: 900px) {
            .photo-grid {
                column-count: 2;
            }
        }

        @media (max-width: 540px) {
            .photo-grid {
                column-count: 1;
            }
        }
    </style>
</head>

<body>
    <!-- Header minimal -->
    <header class="site-header">
        <div class="container header-inner">
            <a href="/" class="logo">Thomas<span>Colmant</span></a>

            <nav class="main-nav">
                <a href="/#home">Accueil</a>
                <a href="/#portfolio">Portfolio</a>
                <a href="/#about">À propos</a>
                <a href="/#contact">Contact</a>
            </nav>
        </div>
    </header>

    <main>
        <!-- Section Photographie Salon Aristochiens -->
        <section class="section" id="photographie" style="padding-top: 8rem;">
            <div class="container">
                <div class="section-head">
                    <h2>Photographie Salon Aristochiens</h2>
                </div>

                <button class="btn-ghost" onclick="window.history.back();" style="margin-bottom: 2.5rem;">← Retour à
                    Photographie</button>

                <!-- Grille de photos masonry -->
                <div class="photo-grid">
                    <!-- Photos Salon Aristochiens -->
                    <div class="photo-item">
                        <img src="../img/photo_aristochiens/3M7A9579.jpg" alt="Salon Aristochiens" loading="lazy">
                    </div>
                    <div class="photo-item">
                        <img src="../img/photo_aristochiens/3M7A9720.jpg" alt="Salon Aristochiens" loading="lazy">
                    </div>
                    <div class="photo-item">
                        <img src="../img/photo_aristochiens/1B7A0471.jpg" alt="Salon Aristochiens" loading="lazy">
                    </div>
                    <div class="photo-item">
                        <img src="../img/photo_aristochiens/3M7A9527.jpg" alt="Salon Aristochiens" loading="lazy">
                    </div>
                    <div class="photo-item">
                        <img src="../img/photo_aristochiens/3M7A9800.jpg" alt="Salon Aristochiens" loading="lazy">
                    </div>
                    <div class="photo-item">
                        <img src="../img/photo_aristochiens/3M7A9913.jpg" alt="Salon Aristochiens" loading="lazy">
                    </div>
                    <div class="photo-item">
                        <img src="../img/photo_aristochiens/1B7A0068.jpg" alt="Salon Aristochiens" loading="lazy">
                    </div>
                    <div class="photo-item">
                        <img src="../img/photo_aristochiens/3M7A9976.jpg" alt="Salon Aristochiens" loading="lazy">
                    </div>
                    <div class="photo-item">
                        <img src="../img/photo_aristochiens/3M7A0014.jpg" alt="Salon Aristochiens" loading="lazy">
                    </div>
                </div>
            </div>
            </div>
        </section>



        <!-- Portfolio : Mes projets -->
        <section id="portfolio" class="section">
            <div class="container">
                <div class="section-head">
                    <h2>Mes projets</h2>
                </div>

                <div class="grid-portfolio">
                    <a href="/photographie" class="portfolio-card">
                        <img src="../img/paysages/DSC_0071.jpg" alt="Série photographie">
                        <div class="portfolio-info">
                            <h3>Photographie</h3>
                        </div>
                    </a>

                    <a href="/production-video" class="portfolio-card">
                        <img src="../web tv layover point.png" alt="Production vidéo">
                        <div class="portfolio-info">
                            <h3>Production vidéo</h3>
                        </div>
                    </a>

                    <a href="/montage-motion-design" class="portfolio-card">
                        <img src="../photo_motion_design_categorie.png" alt="Montage et motion design">
                        <div class="portfolio-info">
                            <h3>Montage & motion design</h3>
                        </div>
                    </a>

                    <a href="/affiche-graphisme" class="portfolio-card">
                        <img src="../Capture_decran_2025-09-15_162636.png" alt="Affiches et graphisme">
                        <div class="portfolio-info">

                        </div>

            </div>
        </section>

        <!-- Contact -->
        <section id="contact" class="section">
            <div class="container">
                <div class="section-head">
                    <h2>Me Contacter</h2>
                </div>

                <div class="contact-layout">
                    <div class="contact-info">
                        <p><strong>Email</strong><br>colmant.thomas@gmail.com</p>
                        <p><strong>Localisation</strong><br>France</p>
                        <p>
                            <a href="https://www.linkedin.com/in/thomas-colmant-506629382" target="_blank">
                                LinkedIn
                            </a>
                        </p>
                    </div>

                    <form id="form" action="https://formspree.io/f/mvgwbzja" method="POST" class="contact-form">
                        <input type="text" name="Nom" placeholder="Nom" required>
                        <input type="email" name="Email" placeholder="Email" required>
                        <input type="text" name="Sujet" placeholder="Sujet">
                        <textarea name="Message" placeholder="Message" required></textarea>
                        <button type="submit" class="btn-primary">Envoyer un message</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container footer-inner">
            <span>© 2025 Thomas Colmant.</span>
        </div>
    </footer>

    <script>
        // Navbar scroll effect
        const header = document.querySelector('.site-header');

        window.addEventListener('scroll', function () {
            if (window.scrollY > 150) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });

        // Form submission handling
        const form = document.getElementById('form');
        const submitBtn = document.getElementById('submit-btn');

        if (form) {
            form.addEventListener('submit', async function (e) {
                e.preventDefault();

                // Disable button and show loading state
                submitBtn.disabled = true;
                submitBtn.textContent = 'Envoi en cours...';

                try {
                    const response = await fetch(form.action, {
                        method: 'POST',
                        body: new FormData(form),
                        headers: {
                            'Accept': 'application/json'
                        }
                    });

                    if (response.ok) {
                        alert('✅ Merci pour votre message ! Je vous répondrai bientôt.');
                        form.reset();
                    } else {
                        const data = await response.json();
                        console.error('Response data:', data);

                        if (data.errors) {
                            alert('❌ Erreur : ' + data.errors.map(e => e.message).join(', '));
                        } else if (data.error) {
                            alert('❌ Erreur : ' + data.error);
                        } else {
                            alert('❌ Erreur ' + response.status + '. Ouvre la console (F12) pour plus de détails.');
                        }
                    }
                } catch (error) {
                    console.error('Erreur:', error);
                    alert('❌ Erreur de connexion. Veuillez vérifier votre connexion internet.');
                } finally {
                    // Re-enable button
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Envoyer un message';
                }
            });
        }
    </script>
</body>

</html>
