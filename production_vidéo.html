<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thomas Colmant | Production Vidéo</title>

  <!-- Modern typography: Poppins -->
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Header minimal -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Thomas<span>Colmant</span></a>

      <nav class="main-nav">
        <a href="index.html#home">Accueil</a>
        <a href="index.html#portfolio">Portfolio</a>
        <a href="index.html#about">À propos</a>
        <a href="index.html#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- Section Production Vidéo -->
    <section class="section" id="audiovisuel" style="padding-top: 8rem;">
      <div class="container">
        <div class="section-head">
          <h2>Production Vidéo</h2>
        </div>

        <div class="grid-portfolio" style="display: flex; justify-content: center;">
          <a href="detail_Web_Tv_production_video.html" class="portfolio-card" style="max-width: 400px;">
            <img src="./vidéo_montage/web tv fond.png" alt="Production Web TV">
            <div class="portfolio-info">
              <h3>Production Web TV</h3>
              <p>2025</p>
            </div>
          </a>
        </div>
      </div>
    </section>

    <!-- Portfolio : Mes projets -->
    <section id="portfolio" class="section">
      <div class="container">
        <div class="section-head">
          <h2>Mes projets</h2>
        </div>

        <div class="grid-portfolio">
          <a href="photographie.html" class="portfolio-card">
            <img src="./img/paysages/DSC_0071.jpg" alt="Série photographie">
            <div class="portfolio-info">
              <h3>Photographie</h3>
            </div>
          </a>

          <a href="production_vidéo.html" class="portfolio-card">
            <img src="fond ecran prod audioviusle.png" alt="Production vidéo">
            <div class="portfolio-info">
              <h3>Production vidéo</h3>
            </div>
          </a>

          <a href="Montage_Motion_Design.html" class="portfolio-card">
            <img src="photo_motion_design_categorie.png" alt="Montage et motion design">
            <div class="portfolio-info">
              <h3>Montage & motion design</h3>
            </div>
          </a>

          <a href="Affiche_Graphisme.html" class="portfolio-card">
            <img src="Capture_decran_2025-09-15_162636.png" alt="Affiches et graphisme">
            <div class="portfolio-info">
              <h3>Affiches & graphisme</h3>
            </div>
          </a>
        </div>
      </div>
    </section>

    <!-- Contact -->
    <section id="contact" class="section">
      <div class="container">
        <div class="section-head">
          <h2>Me Contacter</h2>
        </div>

        <div class="contact-layout">
          <div class="contact-info">
            <p><strong>Email</strong><br>colmant.thomas@gmail.com</p>
            <p><strong>Localisation</strong><br>France</p>
            <p>
              <a href="https://www.linkedin.com/in/thomas-colmant-506629382" target="_blank">
                LinkedIn
              </a>
            </p>
          </div>

          <form id="form" action="https://formspree.io/f/mvgwbzja" method="POST" class="contact-form">
            <input type="text" name="Nom" placeholder="Nom" required>
            <input type="email" name="Email" placeholder="Email" required>
            <input type="text" name="Sujet" placeholder="Sujet">
            <textarea name="Message" placeholder="Message" required></textarea>
            <button type="submit" class="btn-primary">Envoyer un message</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <span>© 2025 Thomas Colmant.</span>
    </div>
  </footer>

  <script>
    // Navbar scroll effect
    const header = document.querySelector('.site-header');

    window.addEventListener('scroll', function () {
      if (window.scrollY > 150) {
        header.classList.add('scrolled');
      } else {
        header.classList.remove('scrolled');
      }
    });

    // Formspree
    document.addEventListener('DOMContentLoaded', function () {
      const form = document.getElementById('form');
      if (!form) return;

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        const formData = new FormData(form);

        fetch(form.action, {
          method: 'POST',
          body: formData,
          headers: { 'Accept': 'application/json' }
        }).then(response => {
          if (response.ok) {
            alert('Merci pour votre message !');
            form.reset();
          } else {
            alert('Une erreur est survenue, veuillez réessayer.');
          }
        }).catch(() => {
          alert('Une erreur réseau est survenue, veuillez réessayer.');
        });
      });
    });

    // Smooth scrolling
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function (e) {
        const targetId = this.getAttribute('href');
        const targetElement = document.querySelector(targetId);

        if (targetElement) {
          e.preventDefault();
          window.scrollTo({
            top: targetElement.offsetTop - 80,
            behavior: 'smooth'
          });
        }
      });
    });
  </script>
</body>

</html>
